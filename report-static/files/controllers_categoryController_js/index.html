<div class="container">
  <div class="row">
    <textarea id="file-source" class="col-md-12">const Category = require(&#039;../models/Category&#039;);
const Item = require(&#039;../models/Item&#039;);

// Admin Dashboard (Show all products for management) 
exports.getAdminDashboard = async (req, res) =&gt; {
    try {
        // 1. Get all categories
        const categoriesData = await Category.find();
        
        // 2. Get ALL products to show Admin (Sorted by Newest)
        // Populate category so we can match IDs accurately
        const products = await Item.find().populate(&#039;seller&#039;).populate(&#039;category&#039;).sort({ createdAt: -1 });
        
        // 3. Map categories with real-time counts from the &#039;products&#039; array
        const categories = categoriesData.map(cat =&gt; {
            const catObj = cat.toObject();
            // Filter products where product&#039;s category ID matches current category ID
            const count = products.filter(p =&gt; {
                if (!p.category) return false;
                // If populated, p.category is an object, if not it&#039;s an ID
                const pCatId = p.category._id ? p.category._id.toString() : p.category.toString();
                return pCatId === cat._id.toString();
            }).length;
            
            catObj.itemCount = count; 
            return catObj;
        });
        
        res.render(&#039;admin&#039;, {
            categories,
            products,
            pageTitle: &#039;Admin Dashboard - Global2Hand&#039;
        });
    } catch (err) {
        console.error(err);
        res.status(500).send(&#039;Server Error&#039;);
    }
};

// Add Category 
exports.postAddCategory = async (req, res) =&gt; {
    try {
        const { name, description } = req.body;

        // Check if category already exists
        let category = await Category.findOne({ name });
        if (category) {
            return res.redirect(&#039;/admin/dashboard?error=หมวดหมู่นี้มีอยู่แล้ว&#039;);
        }

        const newCategory = new Category({ name, description });
        await newCategory.save();

        res.redirect(&#039;/admin/dashboard&#039;);
    } catch (err) {
        console.error(err);
        res.redirect(&#039;/admin/dashboard?error=ไม่สามารถเพิ่มหมวดหมู่ได้&#039;);
    }
};

// Delete Category (Optional for admin management) 
exports.deleteCategory = async (req, res) =&gt; {
    try {
        await Category.findByIdAndDelete(req.params.id);
        res.redirect(&#039;/admin/dashboard&#039;);
    } catch (err) {
        console.error(err);
        res.redirect(&#039;/admin/dashboard&#039;);
    }
};</textarea>
